name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest runner already ships a licensed Android SDK,
      # so no setup-android step is needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Run lint
        run: gradle lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-cards-debug
          path: app/build/outputs/apk/debug/app-debug.apk
